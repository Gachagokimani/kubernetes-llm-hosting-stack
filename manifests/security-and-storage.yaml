apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-app-config
  namespace: ai-stack
data:
  UPLOAD_DIR: "/shared/uploads"
  KB_FILE: "/shared/kb/knowledge_base.json"
  LLAMA_URL: "http://llama-server:8080/v1/chat/completions"
  SEARXNG_URL: "http://searxng:8080/search"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rag-shared-pvc
  namespace: ai-stack
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: restrict-llama-ingress
  namespace: ai-stack
spec:
  podSelector:
    matchLabels:
      app: llama-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: rag-frontend
      ports:
        - protocol: TCP
          port: 8080
