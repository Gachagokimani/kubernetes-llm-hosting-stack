apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: ai-stack
data:
  settings.yml: |
    use_default_settings: true
    server:
      secret_key: "killercoda-ai-stack-secret"
      limiter: false
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server
        args: ["-hf", "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
        ports:
        - containerPort: 8080
        resources:
          requests: { memory: "512Mi", cpu: "100m" }
          limits: { memory: "1200Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
        resources:
          requests: { memory: "256Mi", cpu: "50m" }
          limits: { memory: "512Mi" }
      volumes:
      - name: config
        configMap:
          name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: searxng
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30881
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      initContainers:
      - name: fetch-latest-app
        image: alpine/git:2.47.2
        command: ["/bin/sh", "-c"]
        args:
          - |
            git clone --depth 1 https://github.com/Gachagokimani/kubernetes-llm-hosting-stack.git /tmp/repo && \
            cp -r /tmp/repo/app/* /app/ && \
            cp /tmp/repo/requirements.txt /app/requirements.txt
        volumeMounts:
        - name: app-workspace
          mountPath: /app
      containers:
      - name: rag-frontend
        image: python:3.11-slim
        env:
        - name: LLAMA_URL
          value: "http://llama-server:8080/v1/chat/completions"
        - name: SEARXNG_URL
          value: "http://searxng:8080/search"
        command: ["/bin/sh", "-c"]
        args: ["pip install --no-cache-dir -r /app/requirements.txt && uvicorn rag_app:app --app-dir /app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: app-workspace
          mountPath: /app
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits: { memory: "384Mi" }
      volumes:
      - name: app-workspace
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30882
