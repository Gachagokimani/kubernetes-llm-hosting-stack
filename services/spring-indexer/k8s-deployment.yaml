apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: doc-indexer-spring
  template:
    metadata:
      labels:
        app: doc-indexer-spring
    spec:
      containers:
      - name: doc-indexer-spring
        image: eclipse-temurin:17-jdk-alpine
        command:
        - /bin/sh
        - -c
        - |
          mkdir -p /app/com/brighton/indexer &&
          cp /config/IndexerApplication.java /app/com/brighton/indexer/ &&
          javac -d /app /app/com/brighton/indexer/IndexerApplication.java &&
          java -Xms32m -Xmx96m -XX:+UseSerialGC -cp /app com.brighton.indexer.IndexerApplication
        envFrom:
        - configMapRef:
            name: shared-app-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: java-src
          mountPath: /config
        - name: shared-storage
          mountPath: /shared
        resources:
          requests: { memory: "64Mi", cpu: "25m" }
          limits: { memory: "160Mi", cpu: "250m" }
      volumes:
      - name: java-src
        configMap:
          name: java-indexer-src
      - name: shared-storage
        persistentVolumeClaim:
          claimName: rag-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: doc-indexer-spring
  ports:
  - port: 8080
    targetPort: 8080
