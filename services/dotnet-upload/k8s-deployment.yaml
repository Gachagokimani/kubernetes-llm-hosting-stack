apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdf-ingest-dotnet
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pdf-ingest-dotnet
  template:
    metadata:
      labels:
        app: pdf-ingest-dotnet
    spec:
      containers:
        - name: dotnet-api
          image: mcr.microsoft.com/dotnet/sdk:8.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              git clone --depth 1 https://github.com/Gachagokimani/kubernetes-llm-hosting-stack.git /tmp/repo &&
              mkdir -p /src && cd /src &&
              dotnet new web --force &&
              dotnet add package Npgsql --version 8.0.5 &&
              cp /tmp/repo/services/dotnet-upload/Program.cs /src/Program.cs &&
              dotnet run --urls http://0.0.0.0:8080
          envFrom:
            - configMapRef:
                name: ai-stack-config
            - secretRef:
                name: ai-stack-secrets
                optional: true
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: shared-data
              mountPath: /shared
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: shared-data
          persistentVolumeClaim:
            claimName: rag-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pdf-ingest-dotnet
  namespace: ai-stack
spec:
  selector:
    app: pdf-ingest-dotnet
  ports:
    - port: 8080
      targetPort: 8080
