apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: doc-indexer-spring
  template:
    metadata:
      labels:
        app: doc-indexer-spring
    spec:
      initContainers:
      - name: fetch-spring-src
        image: alpine/git:2.47.2
        command: ["/bin/sh", "-c", "git clone --depth 1 https://github.com/Gachagokimani/kubernetes-llm-hosting-stack.git /tmp/repo && cp -r /tmp/repo/services/spring-indexer/* /src/"]
        volumeMounts:
        - name: src
          mountPath: /src
      containers:
      - name: doc-indexer-spring
        image: maven:3.9.9-eclipse-temurin-17
        workingDir: /src
        command: ["mvn", "spring-boot:run"]
        envFrom:
        - configMapRef:
            name: shared-app-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: src
          mountPath: /src
        - name: shared-storage
          mountPath: /shared
        resources:
          requests: { memory: "384Mi", cpu: "100m" }
          limits: { memory: "896Mi" }
      volumes:
      - name: src
        emptyDir: {}
      - name: shared-storage
        persistentVolumeClaim:
          claimName: rag-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: doc-indexer-spring
  ports:
  - port: 8080
    targetPort: 8080
