apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-stack-config
  namespace: ai-stack
data:
  LLM_URL: "http://llama-server:8080/v1/chat/completions"
  SEARXNG_URL: "http://searxng:8080/search"
  DOTNET_BASE_URL: "http://pdf-ingest-dotnet:8080"
  RBAC_BASE_URL: "http://rbac-sso-dotnet:8080"
  SPRING_INDEX_URL: "http://doc-indexer-spring:8080/api/index/sync"
  UPLOAD_DIR: "/shared/uploads"
  CHAT_DIR: "/shared/chats"
  KB_FILE: "/shared/kb/knowledge_base.json"
  PROPOSALS_FILE: "/shared/kb/proposals_offers.json"
  OAUTH_AUTH_URL: "https://github.com/login/oauth/authorize"
  OAUTH_TOKEN_URL: "https://github.com/login/oauth/access_token"
  OAUTH_USER_URL: "https://api.github.com/user"
