        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: var(--bg-dark);
          color: var(--text-main);
          line-height: 1.6;
          overflow-x: hidden;
        }

        /* Animated Ambient Background Orbs */
        .bg-orb {
          position: fixed;
          border-radius: 50%;
          filter: blur(110px);
          z-index: -1;
          opacity: 0.45;
          animation: floatOrb 14s ease-in-out infinite alternate;
        }
        .orb-crimson { width: 420px; height: 420px; background: var(--crimson); top: -100px; left: -120px; }
        .orb-turquoise { width: 460px; height: 460px; background: var(--turquoise); bottom: -120px; right: -100px; animation-delay: -7s; }

        @keyframes floatOrb {
