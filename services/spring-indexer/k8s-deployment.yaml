apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: doc-indexer-spring
  template:
    metadata:
      labels:
        app: doc-indexer-spring
    spec:
      initContainers:
      - name: compile-java-indexer
        image: eclipse-temurin:17-jdk-alpine
        command:
        - /bin/sh
        - -c
        - |
          apk add --no-cache git &&
          git clone --depth 1 https://github.com/Gachagokimani/kubernetes-llm-hosting-stack.git /tmp/repo &&
          mkdir -p /app &&
          javac -d /app /tmp/repo/services/spring-indexer/src/main/java/com/brighton/indexer/IndexerApplication.java
        volumeMounts:
        - name: app-bin
          mountPath: /app
      containers:
      - name: doc-indexer-spring
        image: eclipse-temurin:17-jre-alpine
        command: ["java", "-Xms32m", "-Xmx96m", "-XX:+UseSerialGC", "-cp", "/app", "com.brighton.indexer.IndexerApplication"]
        envFrom:
        - configMapRef:
            name: shared-app-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: app-bin
          mountPath: /app
        - name: shared-storage
          mountPath: /shared
        resources:
          requests: { memory: "64Mi", cpu: "25m" }
          limits: { memory: "160Mi", cpu: "250m" }
      volumes:
      - name: app-bin
        emptyDir: {}
      - name: shared-storage
        persistentVolumeClaim:
          claimName: rag-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: doc-indexer-spring
  ports:
  - port: 8080
    targetPort: 8080
