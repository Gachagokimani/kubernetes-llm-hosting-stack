      <script>
        // Scroll Reveal Observer
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
        }, { threshold: 0.12 });
        document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

        function askPreset(text) {
          document.getElementById('q').value = text;
          send();
        }

        async function send() {
          const qInput = document.getElementById('q');
          const btn = document.getElementById('btn');
          const chat = document.getElementById('chat');
          const query = qInput.value.trim();
          if (!query) return;

          chat.innerHTML += `<div class="msg"><span class="user-msg">You:</span> ${query}</div>`;
          qInput.value = '';
          btn.disabled = true;
          chat.scrollTop = chat.scrollHeight;

          try {
            const res = await fetch('/api/chat', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ query, use_web: document.getElementById('web').checked })
            });
            const data = await res.json();
            const srcs = [...(data.local_sources || []), ...(data.web_sources || [])];
            const srcHtml = srcs.length ? `<div class="src-box">Grounded in ${srcs.length} retrieved source(s)</div>` : '';
            chat.innerHTML += `<div class="msg"><span class="bot-msg"><b>AI Concierge:</b> ${data.answer}</span>${srcHtml}</div>`;
          } catch (e) {
            chat.innerHTML += `<div class="msg" style="color:#fb7185;">Connection error: ${e}</div>`;
          }
          btn.disabled = false;
          chat.scrollTop = chat.scrollHeight;
        }
      </script>
