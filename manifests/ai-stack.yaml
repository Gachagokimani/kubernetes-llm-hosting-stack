      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Brighton Kimani | AI, Automation, DevOps & SRE Portfolio</title>
      <style>
        :root {
          --bg-dark: #090d16;
          --bg-card: #111827;
          --bg-card-hover: #172033;
          --crimson: #e11d48;
