    import os, math, re, urllib.request, urllib.parse, json
    from collections import Counter
    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse
    from pydantic import BaseModel

    app = FastAPI()
    LLAMA_URL = os.getenv("LLAMA_URL", "http://llama-server:8080/v1/chat/completions")
    SEARXNG_URL = os.getenv("SEARXNG_URL", "http://searxng:8080/search")

    LOCAL_DOCS = [
        "Brighton Kimani is an AI, Automation, DevOps, and SRE specialist based in Nairobi (+254115482990, gachagokimani@gmail.com) with a BSc in Information Technology from Kirinyaga University (2021-2025).",
        "At Glimpse Travel & Tours (Nov 2026 - Present), Brighton works as a Part-Time Software Automation Engineer architecting multi-tenant workflows, custom vendor branding interfaces, and automated pipeline services for a unified travel product catalogue.",
        "At Safaricom PLC (Oct 2025 - Oct 2026), Brighton served as an AI & Automations Engineer building full-stack microservices automating ITSM, onboarding, and waste management with UiPath, n8n, Playwright, and PyTorch chat interfaces, cutting execution time from days to minutes, alongside OpenShift, AWS, Jenkins, GitOps (FluxCD, GitLab), and Technovation mentorship.",
        "At Bill Motors (Jan 2024 - Oct 2025), Brighton worked as an Automation Engineer building self-service cloud infrastructure with Terraform, automated self-healing systems, CI/CD pipelines, and DevSecOps security gates.",
        "Brighton also brings digital content and SEO leadership from Howam Productions (Social Media Marketing Specialist, Jun 2024 - Sep 2025) and Journey Palette (Content Marketing Specialist, May 2024 - Aug 2025).",
        "Brighton built and published the open-source Kubernetes LLM Hosting Stack (github.com/Gachagokimani/kubernetes-llm-hosting-stack) running llama.cpp GGUF inference, SearXNG meta-search, and FastAPI hybrid RAG on resource-constrained Kubernetes nodes."
    ]

    def cosine_sim(a: str, b: str) -> float:
        wa = Counter(re.findall(r"\w+", a.lower()))
        wb = Counter(re.findall(r"\w+", b.lower()))
        common = set(wa.keys()) & set(wb.keys())
        num = sum(wa[w] * wb[w] for w in common)
        den = math.sqrt(sum(v*v for v in wa.values())) * math.sqrt(sum(v*v for v in wb.values()))
        return num / den if den else 0.0

    def retrieve_local(query: str, top_k: int = 3):
        scored = sorted(LOCAL_DOCS, key=lambda d: cosine_sim(query, d), reverse=True)
        return [d for d in scored[:top_k] if cosine_sim(query, d) > 0.04]

    def search_web(query: str, max_results: int = 2):
        try:
            url = f"{SEARXNG_URL}?q={urllib.parse.quote(query)}&format=json"
            req = urllib.request.Request(url, headers={"User-Agent": "Brighton-Portfolio-Agent/1.0"})
            with urllib.request.urlopen(req, timeout=5) as resp:
                data = json.loads(resp.read().decode())
                results = data.get("results", [])[:max_results]
                return [f"{r.get('title', '')}: {r.get('content', '')}" for r in results]
        except Exception as e:
            return [f"(Web search offline: {e})"]

    class ChatRequest(BaseModel):
        query: str
        use_web: bool = False

    @app.get("/", response_class=HTMLResponse)
    def ui():
        with open("/app/index.html") as f:
            return f.read()

    @app.post("/api/chat")
    def chat(req: ChatRequest):
        local_ctx = retrieve_local(req.query)
        web_ctx = search_web(req.query) if req.use_web else []
        context_block = ""
        if local_ctx:
            context_block += "Brighton Kimani CV & Portfolio Context:\n- " + "\n- ".join(local_ctx) + "\n\n"
        if web_ctx:
            context_block += "Live SearXNG Web Context:\n- " + "\n- ".join(web_ctx) + "\n\n"

        prompt = f"Answer professionally on behalf of Brighton Kimani's portfolio using the context below.\n\n{context_block}Visitor Question: {req.query}"
        payload = json.dumps({
            "model": "qwen2.5-0.5b",
            "messages": [
                {"role": "system", "content": "You are Brighton Kimani's AI Portfolio Concierge running live on Kubernetes. Be concise, confident, and accurate."},
                {"role": "user", "content": prompt}
            ],
            "temperature": 0.3,
            "max_tokens": 300
        }).encode("utf-8")

        http_req = urllib.request.Request(LLAMA_URL, data=payload, headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(http_req, timeout=60) as resp:
            llm_data = json.loads(resp.read().decode())
            answer = llm_data["choices"][0]["message"]["content"]

        return {"answer": answer, "local_sources": local_ctx, "web_sources": web_ctx}

