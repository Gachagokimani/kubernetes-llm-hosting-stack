          100% { transform: translate(45px, 35px) scale(1.12); }
        }

        /* Navbar */
        nav {
          position: sticky;
          top: 0;
          z-index: 50;
          backdrop-filter: blur(14px);
          background: rgba(9, 13, 22, 0.8);
          border-bottom: 1px solid var(--border);
          padding: 1rem 2rem;
          display: flex;
          justify-content: space-between;
          align-items: center;
        }
