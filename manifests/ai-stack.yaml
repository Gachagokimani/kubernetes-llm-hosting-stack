apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng-config
  namespace: ai-stack
data:
  settings.yml: |
    use_default_settings: true
    server:
      secret_key: "killercoda-ai-stack-secret"
      limiter: false
    search:
      formats:
        - html
        - json
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-frontend-code
  namespace: ai-stack
data:
  rag_app.py: |
    import os, math, re, urllib.request, urllib.parse, json
    from collections import Counter
    from fastapi import FastAPI
    from fastapi.responses import HTMLResponse
    from pydantic import BaseModel

    app = FastAPI()
    LLAMA_URL = os.getenv("LLAMA_URL", "http://llama-server:8080/v1/chat/completions")
    SEARXNG_URL = os.getenv("SEARXNG_URL", "http://searxng:8080/search")

    LOCAL_DOCS = [
        "Sybyl GPU Nodes run Ubuntu 22.04 LTS with NVIDIA Driver 550/560, CUDA 12.x, and the NVIDIA GPU Operator.",
        "Ollama uses llama.cpp under the hood and serves models in GGUF format quantized to Q4_K_M or Q8_0.",
        "In Kubernetes, GPU workloads require nvidia.com/gpu resource limits and matching node taints/tolerations.",
        "Longhorn provides persistent block storage for GGUF model weights across pod restarts, while Traefik + MetalLB handle ingress."
    ]

    def cosine_sim(a: str, b: str) -> float:
        wa = Counter(re.findall(r"\w+", a.lower()))
        wb = Counter(re.findall(r"\w+", b.lower()))
        common = set(wa.keys()) & set(wb.keys())
        num = sum(wa[w] * wb[w] for w in common)
        den = math.sqrt(sum(v*v for v in wa.values())) * math.sqrt(sum(v*v for v in wb.values()))
        return num / den if den else 0.0

    def retrieve_local(query: str, top_k: int = 2):
        scored = sorted(LOCAL_DOCS, key=lambda d: cosine_sim(query, d), reverse=True)
        return [d for d in scored[:top_k] if cosine_sim(query, d) > 0.05]

    def search_web(query: str, max_results: int = 3):
        try:
            url = f"{SEARXNG_URL}?q={urllib.parse.quote(query)}&format=json"
            req = urllib.request.Request(url, headers={"User-Agent": "Sybyl-RAG-Agent/1.0"})
            with urllib.request.urlopen(req, timeout=5) as resp:
                data = json.loads(resp.read().decode())
                results = data.get("results", [])[:max_results]
                return [f"{r.get('title', '')}: {r.get('content', '')}" for r in results]
        except Exception as e:
            return [f"(SearXNG search unavailable: {e})"]

    class ChatRequest(BaseModel):
        query: str
        use_web: bool = True

    @app.get("/", response_class=HTMLResponse)
    def ui():
        with open("/app/index.html") as f:
            return f.read()

    @app.post("/api/chat")
    def chat(req: ChatRequest):
        local_ctx = retrieve_local(req.query)
        web_ctx = search_web(req.query) if req.use_web else []
        context_block = ""
        if local_ctx:
            context_block += "Local Runbook Context:\n- " + "\n- ".join(local_ctx) + "\n\n"
        if web_ctx:
            context_block += "Live Web Search Context:\n- " + "\n- ".join(web_ctx) + "\n\n"

        prompt = f"Use the retrieved context below to answer concisely.\n\n{context_block}Question: {req.query}"
        payload = json.dumps({
            "model": "qwen2.5-0.5b",
            "messages": [
                {"role": "system", "content": "You are a concise Kubernetes & AI Infrastructure assistant."},
                {"role": "user", "content": prompt}
            ],
            "temperature": 0.3,
            "max_tokens": 300
        }).encode("utf-8")

        http_req = urllib.request.Request(LLAMA_URL, data=payload, headers={"Content-Type": "application/json"})
        with urllib.request.urlopen(http_req, timeout=60) as resp:
            llm_data = json.loads(resp.read().decode())
            answer = llm_data["choices"][0]["message"]["content"]

        return {"answer": answer, "local_sources": local_ctx, "web_sources": web_ctx}

  index.html: |
    <!DOCTYPE html>
    <html>
    <head>
      <title>AI Stack RAG + SearXNG Console</title>
      <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; background: #0f172a; color: #e2e8f0; }
        h2 { color: #38bdf8; }
        #chat { border: 1px solid #334155; border-radius: 8px; padding: 1rem; height: 420px; overflow-y: auto; background: #1e293b; margin-bottom: 1rem; }
        .msg { margin-bottom: 1rem; line-height: 1.5; }
        .user { color: #93c5fd; font-weight: 600; }
        .bot { color: #f8fafc; white-space: pre-wrap; }
        .sources { font-size: 0.8rem; color: #94a3b8; background: #0f172a; padding: 0.5rem; border-radius: 6px; margin-top: 0.4rem; }
        .controls { display: flex; gap: 0.5rem; }
        input[type="text"] { flex: 1; padding: 0.65rem; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: white; }
        button { padding: 0.65rem 1.2rem; border-radius: 6px; border: none; background: #0284c7; color: white; font-weight: 600; cursor: pointer; }
        button:disabled { opacity: 0.5; }
      </style>
    </head>
    <body>
      <h2>K8s AI Stack — RAG + SearXNG + llama.cpp</h2>
      <div id="chat"></div>
      <div class="controls">
        <input id="q" type="text" placeholder="Ask about Sybyl GPU nodes, GGUF, or live web info..." onkeydown="if(event.key==='Enter') send()" />
        <label style="display:flex;align-items:center;gap:4px;font-size:0.85rem;">
          <input id="web" type="checkbox" checked /> Web Search
        </label>
        <button id="btn" onclick="send()">Send</button>
      </div>
      <script>
        async function send() {
          const qInput = document.getElementById('q');
          const btn = document.getElementById('btn');
          const chat = document.getElementById('chat');
          const query = qInput.value.trim();
          if (!query) return;

          chat.innerHTML += `<div class="msg"><span class="user">You:</span> ${query}</div>`;
          qInput.value = '';
          btn.disabled = true;

          try {
            const res = await fetch('/api/chat', {
              method: 'POST',
              headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({ query, use_web: document.getElementById('web').checked })
            });
            const data = await res.json();
            const srcs = [...(data.local_sources || []), ...(data.web_sources || [])];
            const srcHtml = srcs.length ? `<div class="sources"><b>Retrieved Context:</b><br>${srcs.join('<br>')}</div>` : '';
            chat.innerHTML += `<div class="msg"><span class="bot"><b>Assistant:</b> ${data.answer}</span>${srcHtml}</div>`;
          } catch (e) {
            chat.innerHTML += `<div class="msg" style="color:#f87171;">Error: ${e}</div>`;
          }
          btn.disabled = false;
          chat.scrollTop = chat.scrollHeight;
        }
      </script>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server
        args: ["-hf", "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
        ports:
        - containerPort: 8080
        resources:
          requests: { memory: "512Mi", cpu: "100m" }
          limits: { memory: "1200Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
        resources:
          requests: { memory: "256Mi", cpu: "50m" }
          limits: { memory: "512Mi" }
      volumes:
      - name: config
        configMap:
          name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: searxng
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30881
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
      - name: rag-frontend
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args: ["pip install --no-cache-dir fastapi uvicorn && uvicorn rag_app:app --app-dir /app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits: { memory: "384Mi" }
      volumes:
      - name: app-code
        configMap:
          name: rag-frontend-code
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30882
