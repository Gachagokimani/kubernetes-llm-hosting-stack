apiVersion: apps/v1
kind: Deployment
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: doc-indexer-spring
  template:
    metadata:
      labels:
        app: doc-indexer-spring
    spec:
      initContainers:
      - name: build-spring-jar
        image: maven:3.9.9-eclipse-temurin-17
        command:
        - /bin/sh
        - -c
        - |
          git clone --depth 1 https://github.com/Gachagokimani/kubernetes-llm-hosting-stack.git /tmp/repo &&
          cd /tmp/repo/services/spring-indexer &&
          mvn clean package -DskipTests -B &&
          cp target/*.jar /app/app.jar
        resources:
          requests: { memory: "256Mi", cpu: "200m" }
          limits: { memory: "768Mi", cpu: "500m" }
        volumeMounts:
        - name: app-bin
          mountPath: /app
      containers:
      - name: doc-indexer-spring
        image: eclipse-temurin:17-jre-alpine
        command: ["java", "-Xms64m", "-Xmx160m", "-XX:+UseSerialGC", "-jar", "/app/app.jar"]
        envFrom:
        - configMapRef:
            name: shared-app-config
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: app-bin
          mountPath: /app
        - name: shared-storage
          mountPath: /shared
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits: { memory: "256Mi", cpu: "300m" }
      volumes:
      - name: app-bin
        emptyDir: {}
      - name: shared-storage
        persistentVolumeClaim:
          claimName: rag-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: doc-indexer-spring
  namespace: ai-stack
spec:
  type: ClusterIP
  selector:
    app: doc-indexer-spring
  ports:
  - port: 8080
    targetPort: 8080
