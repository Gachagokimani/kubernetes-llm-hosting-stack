---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-server
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama-server
  template:
    metadata:
      labels:
        app: llama-server
    spec:
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server
        args: ["-hf", "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M", "--host", "0.0.0.0", "--port", "8080", "-c", "2048"]
        ports:
        - containerPort: 8080
        resources:
          requests: { memory: "512Mi", cpu: "100m" }
          limits: { memory: "1200Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: llama-server
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: llama-server
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30880
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      containers:
      - name: searxng
        image: searxng/searxng:latest
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: config
          mountPath: /etc/searxng/settings.yml
          subPath: settings.yml
        resources:
          requests: { memory: "256Mi", cpu: "50m" }
          limits: { memory: "512Mi" }
      volumes:
      - name: config
        configMap:
          name: searxng-config
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: searxng
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30881
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: ai-stack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
      - name: rag-frontend
        image: python:3.11-slim
        command: ["/bin/sh", "-c"]
        args: ["pip install --no-cache-dir fastapi uvicorn && uvicorn rag_app:app --app-dir /app --host 0.0.0.0 --port 8000"]
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: app-code
          mountPath: /app
        resources:
          requests: { memory: "128Mi", cpu: "50m" }
          limits: { memory: "384Mi" }
      volumes:
      - name: app-code
        configMap:
          name: rag-frontend-code
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend
  namespace: ai-stack
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30882
